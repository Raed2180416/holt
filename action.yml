name: 'holt ci'
description: 'Fail a merge that would abandon work: audits every branch by CONTENT (merge-tree), not ancestry. Requires fetch-depth: 0.'
branding: { icon: 'shield', color: 'green' }
inputs:
  base:
    description: 'Base ref to compare against (default: auto-resolved)'
    required: false
    default: ''
  fail-on-unlanded:
    description: 'Fail when any branch (other than the PR head) still holds unlanded content'
    required: false
    default: 'true'
  max-age-days:
    description: 'Only fail on unlanded branches older than this many days'
    required: false
    default: ''
  ignore:
    description: 'Comma-separated branch names to exempt'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # Inputs are passed through the ENVIRONMENT, never interpolated into the script with
    # ${{ }}. Interpolating an input straight into a run: block lets a value derived from a PR
    # title or branch name inject shell — the classic GitHub Actions script-injection hole.
    # In env, an input is only ever data; the script quotes it and holt itself validates it.
    - shell: bash
      env:
        HOLT_IN_BASE: ${{ inputs.base }}
        HOLT_IN_FAIL: ${{ inputs.fail-on-unlanded }}
        HOLT_IN_AGE: ${{ inputs.max-age-days }}
        HOLT_IN_IGNORE: ${{ inputs.ignore }}
      run: |
        set -euo pipefail
        npm install -g "github:Raed2180416/holt" >/dev/null 2>&1 || npm install -g holt >/dev/null 2>&1
        ARGS=()
        [ "$HOLT_IN_FAIL" = "true" ] && ARGS+=(--fail-on-unlanded)
        [ -n "$HOLT_IN_AGE" ] && ARGS+=(--max-age-days "$HOLT_IN_AGE")
        [ -n "$HOLT_IN_BASE" ] && ARGS+=(--base "$HOLT_IN_BASE")
        if [ -n "$HOLT_IN_IGNORE" ]; then
          IFS=',' read -ra IG <<< "$HOLT_IN_IGNORE"
          for b in "${IG[@]}"; do [ -n "$b" ] && ARGS+=(--ignore "$b"); done
        fi
        holt ci "${ARGS[@]}"
