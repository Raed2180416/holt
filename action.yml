name: 'holt ci'
description: 'Fail a merge that would abandon work: audits every branch by content, not ancestry. Requires fetch-depth: 0.'
branding: { icon: 'shield', color: 'green' }
inputs:
  base:
    description: 'Base ref to compare against (default: auto-resolved)'
    required: false
    default: ''
  fail-on-unlanded:
    description: 'Fail when any branch (other than the PR head) still holds unlanded content'
    required: false
    default: 'true'
  max-age-days:
    description: 'Only fail on unlanded branches older than this many days'
    required: false
    default: ''
  ignore:
    description: 'Comma-separated branch names to exempt'
    required: false
    default: ''
  working-directory:
    description: 'Repository directory under GITHUB_WORKSPACE (default: workspace root)'
    required: false
    default: '.'
runs:
  # GitHub's embedded Node 24 runtime executes the dependency-complete bundle from the exact
  # caller-pinned action commit. No shell interpolation, package-manager install, secondary checkout, or
  # mutable network bootstrap occurs at runtime.
  using: 'node24'
  main: 'dist/holt-action.mjs'
