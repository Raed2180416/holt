name: Upload GitHub Pages artifact (pinned)
description: Archive static assets and upload the artifact consumed by deploy-pages.
inputs:
  name:
    description: Artifact name
    required: false
    default: github-pages
  path:
    description: Directory containing the static assets
    required: true
    default: _site/
  retention-days:
    description: Artifact retention in days
    required: false
    default: '1'
outputs:
  artifact_id:
    description: The uploaded artifact ID
    value: ${{ steps.upload-artifact.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - name: Archive artifact
      if: runner.os == 'Linux'
      shell: sh
      run: |
        set -eu
        echo ::group::Archive artifact
        tar \
          --dereference --hard-dereference \
          --directory "$INPUT_PATH" \
          -cvf "$RUNNER_TEMP/artifact.tar" \
          --exclude=.git \
          --exclude=.github \
          .
        echo ::endgroup::
      env:
        INPUT_PATH: ${{ inputs.path }}
    - name: Archive artifact
      if: runner.os == 'macOS'
      shell: sh
      run: |
        set -eu
        echo ::group::Archive artifact
        gtar \
          --dereference --hard-dereference \
          --directory "$INPUT_PATH" \
          -cvf "$RUNNER_TEMP/artifact.tar" \
          --exclude=.git \
          --exclude=.github \
          .
        echo ::endgroup::
      env:
        INPUT_PATH: ${{ inputs.path }}
    - name: Archive artifact
      if: runner.os == 'Windows'
      shell: bash
      run: |
        set -eu
        echo ::group::Archive artifact
        tar \
          --dereference --hard-dereference \
          --directory "$INPUT_PATH" \
          -cvf "$RUNNER_TEMP\\artifact.tar" \
          --exclude=.git \
          --exclude=.github \
          --force-local \
          "."
        echo ::endgroup::
      env:
        INPUT_PATH: ${{ inputs.path }}
    - name: Upload artifact
      id: upload-artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/artifact.tar
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error
