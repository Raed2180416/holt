name: social-proof threshold monitor

# Checks weekly whether Holt has earned its badges. This workflow is deliberately report-only:
# enabling public social proof changes a reviewed product claim, so it must land through a signed
# pull request rather than an unsigned scheduled-token commit pushed directly to main.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# The monitor reads the evaluator and repository only. It cannot mutate a branch, create a release,
# or bypass the DCO/protected-branch path when the threshold is reached.
permissions:
  contents: read

jobs:
  milestone:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - name: Evaluate milestone without mutating the repository
        shell: bash
        run: |
          set -uo pipefail
          report="$RUNNER_TEMP/holt-milestone.json"
          set +e
          node scripts/milestone.mjs --check > "$report"
          status=$?
          set -e
          cat "$report"
          MILESTONE_STATUS="$status" MILESTONE_REPORT="$report" node <<'NODE'
          const fs = require('node:fs');
          const status = Number(process.env.MILESTONE_STATUS);
          let report;
          try { report = JSON.parse(fs.readFileSync(process.env.MILESTONE_REPORT, 'utf8')); }
          catch (error) { console.error(`::error::milestone output was not valid JSON: ${error.message}`); process.exit(1); }
          if (!Array.isArray(report.errors) || report.errors.length > 0) {
            console.error(`::error::milestone lookup was incomplete: ${JSON.stringify(report.errors)}`);
            process.exit(1);
          }
          if (typeof report.met !== 'boolean' || !Number.isInteger(status) || status !== (report.met ? 0 : 1)) {
            console.error(`::error::milestone verdict/exit mismatch: status=${status}, report=${JSON.stringify(report)}`);
            process.exit(1);
          }
          if (report.met) {
            console.log('::notice::social-proof threshold reached; enable it in a reviewed, signed pull request');
          } else {
            console.log(`threshold not met; remaining: ${JSON.stringify(report.shortfall)}`);
          }
          NODE
