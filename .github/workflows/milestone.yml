name: social-proof gate

# Checks weekly whether holt has earned its badges. Below the threshold this does nothing at
# all; at or above it, the README's social-proof block is switched on exactly once.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

# This one genuinely needs write: it edits README.md and pushes the commit. `contents: write` is
# the whole of what it needs — no packages, no issues, no pull-requests, no id-token — and it is
# stated here rather than inherited so widening it later is a visible diff.
permissions:
  contents: write

jobs:
  milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Evaluate milestone
        id: gate
        run: node scripts/milestone.mjs --apply || true
      - name: Commit if the README changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name  'holt bot'
            git config user.email 'bot@holt.dev'
            git add README.md
            git commit -m 'readme: social-proof threshold reached — badges enabled'
            git push
          else
            echo "threshold not met or already enabled; nothing to do"
          fi
