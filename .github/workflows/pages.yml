name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# ALREADY LEAST PRIVILEGE, AND DELIBERATELY NOT WIDENED. `pages: write` is what deploy-pages needs
# to publish, `id-token: write` is what it needs to prove the deployment came from this workflow,
# and `contents: read` is what checkout needs. Nothing here gets `contents: write` — a workflow
# that publishes a site has no business being able to push to the repository. This block is not a
# copy of ci.yml's; each workflow states the minimum it genuinely needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the site is self-contained
        # A landing page that silently reaches out to a CDN contradicts the product's central
        # promise. This fails the deploy rather than shipping a page that does.
        run: |
          fail=0
          for f in site/*.html; do
            if grep -oE 'src="https?://|href="https?://[^"]*\.(css|js)|@import|url\(https?://' "$f"; then
              echo "$f references an external asset — pages must be self-contained"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "self-contained: no external assets in any site/*.html"
          exit $fail
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # The upstream composite currently calls upload-artifact by tag. This repository requires
      # every action, including nested composite actions, to be pinned to a full commit, so the
      # checked-in wrapper keeps the Pages artifact path under the same supply-chain rule.
      - uses: Raed2180416/holt/.github/actions/upload-pages-artifact@9cc0938fda28ddfaa2e08498ef5cc4ea1d73948b # v3.0.1
        with:
          name: github-pages
          path: site
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
