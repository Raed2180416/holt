name: site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

# ALREADY LEAST PRIVILEGE, AND DELIBERATELY NOT WIDENED. `pages: write` is what deploy-pages needs
# to publish, `id-token: write` is what it needs to prove the deployment came from this workflow,
# and `contents: read` is what checkout needs. Nothing here gets `contents: write` — a workflow
# that publishes a site has no business being able to push to the repository. This block is not a
# copy of ci.yml's; each workflow states the minimum it genuinely needs.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Verify the site is self-contained
        # A landing page that silently reaches out to a CDN contradicts the product's central
        # promise. This fails the deploy rather than shipping a page that does.
        run: |
          fail=0
          for f in site/*.html; do
            if grep -oE 'src="https?://|href="https?://[^"]*\.(css|js)|@import|url\(https?://' "$f"; then
              echo "$f references an external asset — pages must be self-contained"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "self-contained: no external assets in any site/*.html"
          exit $fail
      - name: Wire the checkout endpoint if configured
        # The "Start a Team plan" button ships with a __HOLT_API__ placeholder and a mailto:
        # fallback. If the repo variable HOLT_API_URL is set (to the deployed license service),
        # inject it here so checkout goes live automatically; otherwise the safe fallback stays.
        env:
          HOLT_API_URL: ${{ vars.HOLT_API_URL }}
        run: |
          if [ -n "$HOLT_API_URL" ]; then
            # Only http(s) origins, nothing that could inject markup.
            case "$HOLT_API_URL" in
              https://*|http://*)
                node -e '
                  const fs=require("fs");
                  const u=process.env.HOLT_API_URL;
                  // HARDENING: the URL is injected into HTML attributes (data-checkout="…").
                  // The case statement already restricts to http(s), but a URL containing quotes,
                  // angle brackets, or spaces could still break out of the attribute context and
                  // inject markup. Validate the URL is a proper origin with no HTML-special chars
                  // before substituting; refuse (and keep the safe fallback) if it is not.
                  try {
                    const parsed=new URL(u);
                    if(!/^https?:$/.test(parsed.protocol))throw new Error("not http(s)");
                    if(parsed.pathname!="/"&&parsed.pathname!=="")throw new Error("must be an origin, not a path");
                    if(/["<>{}\s]/.test(u))throw new Error("contains HTML-special characters");
                  }catch(e){
                    console.error("HOLT_API_URL rejected ("+e.message+"), leaving the mailto fallback");
                    process.exit(0);
                  }
                  const p="site/index.html";
                  fs.writeFileSync(p,fs.readFileSync(p,"utf8").split("__HOLT_API__").join(u));
                  console.log("checkout wired to",u);
                ' ;;
              *) echo "HOLT_API_URL is not an http(s) URL; leaving the mailto fallback"; ;;
            esac
          else
            echo "HOLT_API_URL not set — the Team button keeps its mailto: fallback"
          fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
