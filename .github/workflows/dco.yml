name: dco

# Contributor IP hygiene, the cheap way. Every commit in a PR must carry a
# `Signed-off-by:` line (git commit -s), which is the Developer Certificate of Origin: the
# contributor asserts they have the right to submit that code under the project's license.
# This costs contributors one flag and costs the project nothing, but without it every external
# diff arrives with unclear provenance — which is exactly what an acquirer's diligence flags.
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit must be signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          [ "$missing" = 0 ] && echo "all commits signed off"
          exit $missing
