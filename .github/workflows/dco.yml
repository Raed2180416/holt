name: dco

# Contributor IP hygiene, the cheap way. Every commit in a PR must carry a
# `Signed-off-by:` line (git commit -s), which is the Developer Certificate of Origin: the
# contributor asserts they have the right to submit that code under the project's license.
# This costs contributors one flag and costs the project nothing, but without it every external
# diff arrives with unclear provenance — which is exactly what an acquirer's diligence flags.
on:
  pull_request:
    types: [opened, synchronize, reopened]

# This workflow reads commit messages and writes nothing. It reported its verdict through the
# check's exit status, never through the API — so it never needed `checks: write`, `statuses:
# write` or `pull-requests: write`, and with no `permissions:` block it was being handed whatever
# the repository default happens to be. It runs on `pull_request`, which means a fork's token is
# already read-only, but the default applies on every other path and a repository default is not
# something this file should depend on.
permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - name: every commit must be signed off
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            if ! git log -1 --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a Signed-off-by line (use: git commit -s)"
              missing=1
            fi
          done < <(git rev-list "$base".."$head")
          [ "$missing" = 0 ] && echo "all commits signed off"
          exit $missing
