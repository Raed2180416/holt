name: release body

# A release is a product surface, and it was the only one nothing checked. v0.2.0 was published
# with a body that described a different product and carried no install command, while the README,
# the site and CI all agreed on the same verified one-liner. This job fails the release instead.
#
# It runs on `edited` as well as `published` so that fixing the body re-runs the check, and
# `workflow_dispatch` so an already-published release can be re-checked without touching it.

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of an existing release to re-check, e.g. v0.2.0'
        required: true

# `gh release view --json body` reads a release, which is the `contents` scope at READ. This
# workflow judges a body; it never edits one, so it must not be able to.
permissions:
  contents: read

jobs:
  install-command:
    name: the release body must tell a reader how to install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22' }

      - name: check the published body
        # The body is attacker-influenced text (anyone who can edit a release writes it), so it
        # is passed through the environment and never interpolated into the shell — the same
        # class of hole as interpolating a branch name into a document.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          BODY: ${{ github.event.release.body }}
          FROM_RELEASE_EVENT: ${{ github.event_name == 'release' }}
        run: |
          set -euo pipefail
          if [ "$FROM_RELEASE_EVENT" = "true" ]; then
            printf '%s' "$BODY" > body.md
          else
            gh release view "$TAG" --json body -q .body > body.md
          fi
          node scripts/check-release-body.mjs --tag "$TAG" --body-file body.md

      - name: the checked-in body for this tag must match what was published
        # Otherwise the repository's copy passes the gate forever while the live page says
        # something else — which is exactly how the two drifted apart in the first place.
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          SOURCE=".github/releases/${TAG}.md"
          if [ ! -f "$SOURCE" ]; then
            echo "::error::${SOURCE} is missing — every release keeps its body in the repository"
            exit 1
          fi
          if ! diff -u "$SOURCE" body.md; then
            echo "::error::the published body for ${TAG} differs from ${SOURCE}"
            exit 1
          fi
