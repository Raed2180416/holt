name: ci

# holt's optional backends are the interesting part of CI: the tool must work WITHOUT them
# (degraded, and saying so) and correctly WITH them. Both are exercised, because "works on the
# maintainer's machine where everything is installed" is how a degradation path rots unnoticed.

on:
  push:
    branches: [main]
  pull_request:

# LEAST PRIVILEGE, DECLARED RATHER THAN INHERITED. With no `permissions:` key the GITHUB_TOKEN
# handed to every job here takes the enterprise/organisation/repository default, which on a
# repository that has never been tightened is write access on every scope — for a workflow whose
# entire job is to check out the code and run tests. GitHub's hardening guidance is to set the
# default to read and raise it per job where a job genuinely needs more; nothing in this file
# needs more, so nothing here gets more. `pull_request` from a fork already downgrades the token,
# but that is a property of the event, not of this workflow, and it does not cover `push`.
#
# scripts/check-ci-hardening.mjs fails the build if any workflow in this repository stops
# declaring this.
permissions:
  contents: read

jobs:

  matrix:
    name: core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci
      # The portable core: safety classifier, detection against ground truth, the CLI as a
      # binary, actions (protect/rescue/clean), and the invariant fuzzer. No optional backends —
      # the point of this job is that holt's CORE is correct on every OS, degraded loudly.
      # Known portability hazards already fixed by this matrix existing: URL.pathname vs
      # fileURLToPath (file:///C:/x -> /C:/x), and jj's JJ_CONFIG=/dev/null (jj is Rust; no
      # MSYS translation on Windows — os.devNull).
      # integration.test.mjs is here because it holds the guards that stop an agent destroying
      # work in place — git reset --hard, clean -fd, checkout -- ., restore — plus the primary-tree
      # scan and the no-git-identity rescue path. Every one of those is platform-sensitive (path
      # separators, git's own behaviour, how a shell quotes), and they were being proven on Linux
      # only while shipping to macOS and Windows users.
      # This job's contract is the DEGRADED core: no ctags, no enry, no jscpd, no jj. So it runs
      # the suites that are meaningful without them. Running everything here was tried and is
      # wrong — the language suite asserts `ctags is available` rather than skipping, by design,
      # because a language claim that silently degrades is the failure it exists to catch.
      #
      # Full cross-platform coverage of the REST of the suite is the `full suite on <os>` job
      # below, which installs the backends on all three operating systems.
      #
      # THE LIST IS NOW DATA, IN .github/guard-corpus.txt, AND IT IS LONGER.
      #
      # It used to be typed here, and test/e2e/adversarial.test.mjs was not on it — nor were
      # break-it, strict-read-only, unprotect-force, stash-evidence or verify. Those six reached
      # Windows and macOS only by being swept up in `npm test`'s `test/**/*.test.mjs` glob in the
      # `full suite on <os>` job. That is coverage by accident, and its failure mode is silent:
      #
      #     $ node --test "test/nonexistent/**/*.test.mjs" ; echo $?
      #     ℹ pass 0
      #     0
      #
      # A glob that matches nothing exits 0, so a green `npm test` is not evidence that any named
      # file ran. The adversarial corpus is the suite most likely to expose the FIFTH Windows path
      # bug in a project that has already found four, and it was the one nothing named here.
      #
      # scripts/run-guard-corpus.mjs names every file and refuses to start if one is missing or
      # empty. Each entry is proven to pass with no optional backends installed, which is this
      # job's contract. scripts/check-ci-hardening.mjs fails the build if this step ever stops
      # running on ubuntu-latest, macos-latest AND windows-latest.
      - name: the guard corpus, named explicitly, on this OS
        run: node scripts/run-guard-corpus.mjs
      - run: node bin/holt.mjs doctor --json
      - name: the tool must run against its own repository on this OS
        run: node bin/holt.mjs status --json

      # THE FIRST THING A USER DOES, PROVEN ON THEIR OS. The published install is a global install
      # of the release tarball; it was verified in a Linux container and nowhere else, so the
      # single most common failure mode for a Node CLI on Windows — a bin shim that does not
      # resolve, or a path assumption that only holds under POSIX — could not have been caught.
      - name: install the packed tarball globally and run it, as a user would
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          TARBALL="$(ls "$RUNNER_TEMP"/holt-*.tgz | head -1)"
          npm install -g "$TARBALL"
          holt --version
          # A directory that is NOT the holt checkout, so any reliance on the repo being present
          # (relative optlib paths, fixtures, node_modules) fails here rather than at a user.
          mkdir -p "$RUNNER_TEMP/victim" && cd "$RUNNER_TEMP/victim"
          git init -q -b main .
          git config user.email ci@holt.test && git config user.name CI
          echo base > a.txt && git add -A && git commit -qm base
          git worktree add -q --detach wt1
          echo 'export function ONLY_COPY() {}' > wt1/only.js
          holt status
          holt risk --json > risk.json
          node -e "const r=require('./risk.json');const u=(r.unique||r.workstreams||[]);if(!JSON.stringify(r).includes('wt1'))throw new Error('installed holt did not see the worktree: '+JSON.stringify(r).slice(0,300));console.log('  installed binary correctly analysed a fresh repo')"

  bare:
    name: no optional backends (degradation path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - name: assert the optional tools really are absent
        run: |
          ! command -v ctags || (echo "ctags present; this job must test the degraded path" && exit 1)
          ! command -v enry  || (echo "enry present; this job must test the degraded path" && exit 1)
      - run: npm ci --omit=optional
      - run: node bin/holt.mjs doctor --json
      - name: unit + safety must pass with no backends at all
        run: node --test "test/unit/safety.test.mjs"
      - name: holt must still answer, degraded and labelled
        run: |
          node bin/holt.mjs status --json > /tmp/out.json
          node -e "
            const r = require('/tmp/out.json');
            if (!r.backend.degraded) { console.error('expected degraded backend'); process.exit(1); }
            console.log('degraded as expected:', r.backend.label);
          "

  full:
    name: all backends
    runs-on: ubuntu-latest
    env:
      HOLT_REAL_REPOS: ${{ github.workspace }}/.holt-fixtures
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: 'stable' }

      - name: install universal-ctags
        # apt, deliberately, even though it ships an older parser set (5.9.0 on Ubuntu 24.04, no
        # Terraform/Elm). The snap build is newer but CONFINED: it cannot read files outside the
        # user's home, so every test that tags a fixture in a temp directory fails with an empty
        # result — a sandbox artefact masquerading as a parser regression. holt's language suite
        # is capability-aware (it asks `ctags --list-languages` and reports what this build cannot
        # parse), so the older apt package produces an honest, passing run rather than a false one.
        run: |
          sudo apt-get update && sudo apt-get install -y universal-ctags
          ctags --version | head -1

      - name: install enry (content-based language detection)
        run: |
          go install github.com/go-enry/enry@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: install jj (Jujutsu backend)
        run: |
          cargo install --locked jj-cli --root "$HOME/.local" || echo "jj unavailable; its suite will skip and say so"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install opencode (one of the 29 integration targets holt wires)
        # THE PUBLISHED TEST COUNT MUST NOT DEPEND ON WHAT THE GRADER HAPPENS TO HAVE INSTALLED.
        # test/e2e/opencode-plugin.test.mjs ends in `t.skip('opencode not installed')` when the
        # binary is absent, so this job measured 697 passing while README claimed 698 and
        # BENCHMARKS explained a 698/699 split — three numbers for one suite, and the
        # published-numbers gate failed the build over the difference rather than the difference
        # being fixed.
        #
        # The deeper reason to install it: opencode is a SHIPPED integration target, and the only
        # test that drives the real binary has therefore never run in CI once. An adapter proven
        # solely on the maintainer's machine is exactly the class this workflow's other jobs exist
        # to close.
        run: |
          npm i -g opencode-ai
          opencode --version

      - run: npm ci

      - name: doctor
        run: node bin/holt.mjs doctor

      - name: clone real repositories for the end-to-end suite
        # Cloned to the SAME path every later step reads (see the job-level env below). When these
        # disagreed, the four real-repo tests — the ones with the most external validity — skipped
        # in the suite step and had never once run in CI.
        run: bash scripts/clone-fixtures.sh "$HOLT_REAL_REPOS"

      - name: full suite
        run: npm test

      - name: the tool must be able to inspect its own repository
        run: node bin/holt.mjs status

      - name: published numbers must match reality
        # Doc numbers rot the instant they are written and nothing re-checks them — this repo
        # already shipped README/BENCHMARKS disagreeing with each other AND with the suite. The
        # fix is not vigilance, it is a gate: the claimed test count and mutation score are
        # compared against what the suite actually reports, and a mismatch fails the build.
        # site/index.html is included because it was the ONE surface this gate never checked,
        # and it is the surface the public actually reads — it drifted to 199/13-13 unnoticed.
        # test/unit/published-numbers.test.mjs covers the other half: all surfaces must AGREE.
        run: |
          npm test 2>&1 | tee /tmp/holt-suite.txt >/dev/null || true
          ACTUAL_TESTS=$(grep -oE '^# pass [0-9]+|^ℹ pass [0-9]+' /tmp/holt-suite.txt | grep -oE '[0-9]+' | head -1)
          # A SKIPPED TEST DID NOT RUN, so it cannot count toward "N tests passing". node reports
          # pass and skipped separately, and this gate deliberately compares the published number
          # against PASS — the tests that actually executed. Any new skip therefore lowers the
          # count and fails this gate, which forces the skip to be fixed or the claim corrected,
          # rather than quietly inflating a number nobody re-checks.
          SKIPPED=$(grep -oE '^# skipped [0-9]+|^ℹ skipped [0-9]+' /tmp/holt-suite.txt | grep -oE '[0-9]+' | head -1)
          if [ "${SKIPPED:-0}" != "0" ]; then
            echo "::warning::${SKIPPED} test(s) did not execute and are NOT counted as passing:"
            grep -aE '# SKIP' /tmp/holt-suite.txt | sed 's/^/  /' | head -20
          fi
          ACTUAL_MUT=$(npm run test:mutation 2>&1 | grep -oE '[0-9]+/[0-9]+ mutations killed' | grep -oE '^[0-9]+/[0-9]+')
          echo "suite reports: $ACTUAL_TESTS tests, $ACTUAL_MUT mutations"
          # A GATE THAT CANNOT FAIL IS NOT A GATE. If either parse comes back empty — the
          # reporter changed its wording, the suite died before printing a summary — then every
          # `grep -q "$ACTUAL_TESTS"` below becomes `grep -q ""`, which matches every file ever
          # written, and this step reports "published numbers match the suite" having compared
          # nothing at all. Refuse to proceed on an unmeasured number.
          for pair in "ACTUAL_TESTS:$ACTUAL_TESTS" "ACTUAL_MUT:$ACTUAL_MUT"; do
            if [ -z "${pair#*:}" ]; then
              echo "::error::${pair%%:*} could not be parsed from the suite output — refusing to compare against an empty string"
              exit 1
            fi
          done
          # `grep -q "$ACTUAL_TESTS" "$f"` — the check this replaced — passes the instant those
          # digits appear ANYWHERE in the file: an SVG coordinate, a hex colour, a port number, a
          # year. scripts/check-published-numbers.mjs matches the CLAIM instead (the shields
          # badge, the site tile, the "N tests passing" sentence, the BENCHMARKS table row — the
          # same shapes test/unit/published-numbers.test.mjs already checks agree with each
          # other) and requires every such claim to equal what this run measured. Proven against a
          # scratch fixture, both directions, in test/unit/published-numbers-gate.test.mjs.
          node scripts/check-published-numbers.mjs --tests "$ACTUAL_TESTS" --mutation "$ACTUAL_MUT"

      - name: mutation testing — prove the tests would FAIL on a real defect
        # A green suite proves the tests RAN. This proves they would have caught the specific
        # defects that matter: a tool that authorises deleting work, or runs a command it
        # promised never to run. A survivor fails the build.
        run: npm run test:mutation

  crossplat:
    name: full suite on ${{ matrix.os }}
    # 24 OF 39 TEST FILES RAN ON LINUX ONLY — the MCP protocol, the TUI, the graph export, the
    # journal, the team layer, the monster round, the host manifest, the packaging guard. A tool
    # that manipulates paths for a living was proving its most platform-sensitive half on the one
    # platform where paths are simplest. Three defects in a single session were invisible on Linux
    # and live on macOS and Windows, each found by CI rather than by the suite.
    #
    # So the whole suite runs on all three, with the backends installed. The degraded-core matrix
    # above keeps its narrow list because its contract is the opposite one.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }

      - name: install universal-ctags (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y universal-ctags
      - name: install universal-ctags (macos)
        if: runner.os == 'macOS'
        run: brew install universal-ctags
      - name: install universal-ctags (windows)
        if: runner.os == 'Windows'
        run: choco install universal-ctags -y --no-progress

      # enry is not a nicety here. `.fs` is F# OR Forth, `.m` is Objective-C OR MATLAB, `.h` is C
      # OR C++ OR Objective-C — extension mapping cannot decide, and ctags picks one. Without enry
      # the F# corpus case resolved as Forth and yielded nothing, which is what this job caught on
      # macOS and Windows the first time it ran. Content-based detection is what makes the
      # language claim true, so the platforms that assert it must have it.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version: 'stable' }
      - name: install enry (content-based language detection)
        shell: bash
        run: |
          go install github.com/go-enry/enry@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - name: what this platform actually has
        run: node bin/holt.mjs doctor
      - run: npm test

  static:
    name: static analysis (ratchet)
    # 20,749 lines of JavaScript shipped with no linter, no type checker and no gate of any kind.
    # For a tool whose failure mode is permanent, unrecoverable data loss that is below standard.
    #
    # The gate RATCHETS: the diagnostic count may go down and may never go up. A gate that fails
    # from the day it is added gets deleted within a week; this one is green today, blocks the
    # next regression, and lowers its own ceiling whenever debt is paid down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci
      - run: npm run typecheck
      - name: HOSTS.md must match the manifest it is generated from
        # HOSTS.md drifted from src/integrate/hosts.mjs by hand at least twice (Cursor's block-hook
        # promotion, the Roo/Kilo split) before this existed. Same ratchet shape as typecheck above:
        # the checked-in file and what the generator produces from HOSTS/strengthLabel() must be
        # byte-identical, or the build fails with the regenerate command to run.
        run: npm run hosts:check
      - name: the workflows themselves must stay hardened
        # Three defects, each a SHAPE rather than an instance, and each one that comes back the
        # next time somebody adds a job:
        #   - a workflow with no `permissions:` block, inheriting a token broader than it needs;
        #   - an action pinned to a tag its owner can repoint under us (GitHub Docs: a full-length
        #     commit SHA "is currently the only way to use an action as an immutable release");
        #   - the guard corpus running on fewer than all three operating systems, or a test file
        #     named so that `test/**/*.test.mjs` can never see it.
        # `--self-test` plants one violation of each rule in a scratch copy first and requires the
        # checker to go RED on every one, so a gate that has quietly stopped checking fails the
        # build instead of passing it. It also asserts GREEN on the unmodified tree, because a
        # gate that fails a legitimate change gets deleted.
        run: node scripts/check-ci-hardening.mjs --self-test

  package:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci
      - name: every checked-in release body must carry an install command
        # The gate lives here as well as on the release event so a body is caught in the PR that
        # writes it, not at publish time when someone is already watching the Releases tab.
        run: node scripts/check-release-body.mjs --all
      - name: pack and install globally from the tarball
        run: |
          npm pack
          npm install -g ./holt-*.tgz
      - name: the installed binary must run from a clean directory
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          # A bare CI runner has no git identity, and `git commit` exits 128 without one.
          # Set it locally for this throwaway repo rather than globally.
          git init -q
          git config user.email ci@holt.invalid
          git config user.name 'holt ci'
          git commit -q --allow-empty -m base
          holt doctor
          holt status
      - name: the INSTALLED artifact must answer correctly, not merely start
        # `holt doctor` and `holt status` above prove the binary runs. They do not prove it WORKS —
        # a build missing src/paths.mjs exits 1 for an uncaught exception, which an exit-code check
        # reads as a clean refusal. This drives the installed binary against a real repository with
        # planted at-risk work and checks the ANSWERS: that risk finds the planted work, that it
        # does not invent work in an empty worktree, and that gate's exit code AND its stated
        # verdict agree.
        #
        # It ran only in release-artifact.yml, on tag push — so a commit that broke the shipped
        # artifact stayed invisible until release day. That is exactly how the published v0.2.0
        # came to be missing four runtime modules and 12 of 14 language packs.
        run: node scripts/smoke-installed.mjs --bin holt
      - name: an install without optional dependencies must still work
        # A corporate mirror, `npm i --omit=optional`, and older `--production` installs all do
        # this. `holt integrate` wires 29 MCP targets that every point at `holt mcp`, so a missing
        # runtime dependency here means 29 agents wired to a server that cannot start.
        run: |
          npm install -g --omit=optional ./holt-*.tgz
          node scripts/smoke-installed.mjs --bin holt
      - name: the published tarball must not ship anything operator-only
        run: |
          tar -tzf holt-*.tgz | tee /tmp/files.txt
          # Tests, fixtures, the license SERVER, operator scripts, legal docs, the site, and
          # above all anything key-shaped must never reach a public install. Each of these is a
          # real leak class: server/ holds the mint logic, and a signing key must never ship.
          for bad in 'package/test/' 'package/eval/' 'package/server/' 'package/legal/' 'package/site/' 'package/scripts/' '.key' 'signing' '.env'; do
            if grep -qi "$bad" /tmp/files.txt; then echo "FORBIDDEN in tarball: $bad"; exit 1; fi
          done
          echo "tarball is clean: bin/ src/ README LICENSE only"

  business:
    name: commerce and entitlement
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22' }
      - run: npm ci
      # The paid path is money and reputation, so it is tested on every OS the buyer might run
      # CI on: offline license crypto (forgery, rotation, expiry, the free-tool-never-breaks
      # invariant), the policy engine's refuse-don't-silently-pass behaviour, and the full
      # Stripe purchase path over a real socket.
      - run: node --test test/unit/license.test.mjs test/unit/policy.test.mjs test/unit/server.test.mjs test/unit/milestone.test.mjs test/e2e/purchase-path.test.mjs test/e2e/branches.test.mjs test/e2e/autoprotect.test.mjs
      - name: no src/ file may make a network call (the no-telemetry promise)
        # The property is asserted by test/unit/no-network.test.mjs, which checks CAPABILITY —
        # src/ imports no network-capable module and contains no call site — instead of grepping
        # for URLs against a domain allowlist. The old grep failed the build the moment the
        # product's own pricing URL moved to a domain the allowlist did not name, because a URL in
        # help text is not a network call; and an allowlist is the wrong guarantee anyway, since it
        # says "we only talk to approved hosts" when the promise is "we do not talk".
        # The test also PROVES it fires, against seven planted exfiltration shapes.
        run: node --test test/unit/no-network.test.mjs
