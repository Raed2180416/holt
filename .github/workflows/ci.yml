name: ci

# holt's optional backends are the interesting part of CI: the tool must work WITHOUT them
# (degraded, and saying so) and correctly WITH them. Both are exercised, because "works on the
# maintainer's machine where everything is installed" is how a degradation path rots unnoticed.

on:
  push:
    branches: [main]
  pull_request:

jobs:

  matrix:
    name: core on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      # The portable core: safety classifier, detection against ground truth, the CLI as a
      # binary, actions (protect/rescue/clean), and the invariant fuzzer. No optional backends —
      # the point of this job is that holt's CORE is correct on every OS, degraded loudly.
      # Known portability hazards already fixed by this matrix existing: URL.pathname vs
      # fileURLToPath (file:///C:/x -> /C:/x), and jj's JJ_CONFIG=/dev/null (jj is Rust; no
      # MSYS translation on Windows — os.devNull).
      - run: node --test test/unit/safety.test.mjs test/e2e/detection.test.mjs test/e2e/cli.test.mjs test/e2e/actions.test.mjs test/e2e/fuzz-invariant.test.mjs
      - run: node bin/holt.mjs doctor --json
      - name: the tool must run against its own repository on this OS
        run: node bin/holt.mjs status --json

  bare:
    name: no optional backends (degradation path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: assert the optional tools really are absent
        run: |
          ! command -v ctags || (echo "ctags present; this job must test the degraded path" && exit 1)
          ! command -v enry  || (echo "enry present; this job must test the degraded path" && exit 1)
      - run: npm ci --omit=optional
      - run: node bin/holt.mjs doctor --json
      - name: unit + safety must pass with no backends at all
        run: node --test "test/unit/safety.test.mjs"
      - name: holt must still answer, degraded and labelled
        run: |
          node bin/holt.mjs status --json > /tmp/out.json
          node -e "
            const r = require('/tmp/out.json');
            if (!r.backend.degraded) { console.error('expected degraded backend'); process.exit(1); }
            console.log('degraded as expected:', r.backend.label);
          "

  full:
    name: all backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-go@v5
        with: { go-version: 'stable' }

      - name: install universal-ctags
        run: sudo apt-get update && sudo apt-get install -y universal-ctags

      - name: install enry (content-based language detection)
        run: |
          go install github.com/go-enry/enry@latest
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: install jj (Jujutsu backend)
        run: |
          cargo install --locked jj-cli --root "$HOME/.local" || echo "jj unavailable; its suite will skip and say so"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: npm ci

      - name: doctor
        run: node bin/holt.mjs doctor

      - name: clone real repositories for the end-to-end suite
        run: bash scripts/clone-fixtures.sh

      - name: full suite
        run: npm test
        env:
          HOLT_REAL_REPOS: ${{ github.workspace }}/.holt-fixtures

      - name: the tool must be able to inspect its own repository
        run: node bin/holt.mjs status

      - name: mutation testing — prove the tests would FAIL on a real defect
        # A green suite proves the tests RAN. This proves they would have caught the specific
        # defects that matter: a tool that authorises deleting work, or runs a command it
        # promised never to run. A survivor fails the build.
        run: npm run test:mutation

  package:
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - name: pack and install globally from the tarball
        run: |
          npm pack
          npm install -g ./holt-*.tgz
      - name: the installed binary must run from a clean directory
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          git init -q && git commit -q --allow-empty -m base
          holt doctor
          holt status
      - name: the published tarball must not ship anything operator-only
        run: |
          tar -tzf holt-*.tgz | tee /tmp/files.txt
          # Tests, fixtures, the license SERVER, operator scripts, legal docs, the site, and
          # above all anything key-shaped must never reach a public install. Each of these is a
          # real leak class: server/ holds the mint logic, and a signing key must never ship.
          for bad in 'package/test/' 'package/eval/' 'package/server/' 'package/legal/' 'package/site/' 'package/scripts/' '.key' 'signing' '.env'; do
            if grep -qi "$bad" /tmp/files.txt; then echo "FORBIDDEN in tarball: $bad"; exit 1; fi
          done
          echo "tarball is clean: bin/ src/ README LICENSE only"

  business:
    name: commerce and entitlement
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      # The paid path is money and reputation, so it is tested on every OS the buyer might run
      # CI on: offline license crypto (forgery, rotation, expiry, the free-tool-never-breaks
      # invariant), the policy engine's refuse-don't-silently-pass behaviour, and the full
      # Stripe purchase path over a real socket.
      - run: node --test test/unit/license.test.mjs test/unit/policy.test.mjs test/unit/server.test.mjs test/unit/milestone.test.mjs test/e2e/purchase-path.test.mjs test/e2e/branches.test.mjs test/e2e/autoprotect.test.mjs
      - name: no src/ file may make a network call (the no-telemetry promise)
        if: runner.os != 'Windows'
        run: |
          if grep -rnE "https?://[^\"' )]+|fetch\(|http\.request|net\.connect|dgram" src/ | grep -vE "^\s*//|\* |example\.|localhost|127\.0\.0\.1|holt\.dev/pricing|github\.com" ; then
            echo "a network call appeared in src/ — the free tool must make none"; exit 1
          fi
          echo "src/ makes no network calls"
