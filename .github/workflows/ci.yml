name: ci

# holt's optional backends are the interesting part of CI: the tool must work WITHOUT them
# (degraded, and saying so) and correctly WITH them. Both are exercised, because "works on the
# maintainer's machine where everything is installed" is how a degradation path rots unnoticed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Avoid duplicate push/PR runs racing over the same checkout and leaving a cancelled matrix cell
# as the last visible status. Pull requests may cancel superseded runs; pushes and manual runs are
# retained because their exact commit is release evidence.
concurrency:
  group: holt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# LEAST PRIVILEGE, DECLARED RATHER THAN INHERITED. With no `permissions:` key the GITHUB_TOKEN
# handed to every job here takes the enterprise/organisation/repository default, which on a
# repository that has never been tightened is write access on every scope — for a workflow whose
# entire job is to check out the code and run tests. GitHub's hardening guidance is to set the
# default to read and raise it per job where a job genuinely needs more; nothing in this file
# needs more, so nothing here gets more. `pull_request` from a fork already downgrades the token,
# but that is a property of the event, not of this workflow, and it does not cover `push`.
#
# scripts/check-ci-hardening.mjs fails the build if any workflow in this repository stops
# declaring this.
permissions:
  contents: read

jobs:

  matrix:
    name: core on ${{ matrix.os }}
    # A runner or child process that stops making progress must become an explicit CI failure,
    # never an apparently-live release check. The core matrix normally completes well below this.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', package-manager-cache: false }
      - name: isolate fixture Git configuration (no runner-global filters)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/holt-empty-home" "$RUNNER_TEMP/holt-empty-xdg"
          : > "$RUNNER_TEMP/holt-empty-gitconfig"
          {
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/holt-empty-gitconfig"
            echo "GIT_CONFIG_SYSTEM=$RUNNER_TEMP/holt-empty-gitconfig"
            echo "HOME=$RUNNER_TEMP/holt-empty-home"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/holt-empty-xdg"
          } >> "$GITHUB_ENV"
      - name: isolate fixture Git configuration (no runner-global filters)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'holt-empty-gitconfig'
          $holtHome = Join-Path $env:RUNNER_TEMP 'holt-empty-home'
          $holtXdg = Join-Path $env:RUNNER_TEMP 'holt-empty-xdg'
          New-Item -ItemType Directory -Force -Path $holtHome, $holtXdg | Out-Null
          New-Item -ItemType File -Force -Path $config | Out-Null
          "GIT_CONFIG_GLOBAL=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GIT_CONFIG_SYSTEM=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HOME=$holtHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XDG_CONFIG_HOME=$holtXdg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks
      - run: npm ci
      - name: committed Node 24 action bundle is reproducible on this OS
        run: npm run action:check
      # The portable core: safety classifier, detection against ground truth, the CLI as a
      # binary, actions (protect/rescue/clean), and the invariant fuzzer. No optional backends —
      # the point of this job is that holt's CORE is correct on every OS, degraded loudly.
      # Known portability hazards already fixed by this matrix existing: URL.pathname vs
      # fileURLToPath (file:///C:/x -> /C:/x), and jj's JJ_CONFIG=/dev/null (jj is Rust; no
      # MSYS translation on Windows — os.devNull).
      # integration.test.mjs is here because it holds the guards that stop an agent destroying
      # work in place — git reset --hard, clean -fd, checkout -- ., restore — plus the primary-tree
      # scan and the no-git-identity rescue path. Every one of those is platform-sensitive (path
      # separators, git's own behaviour, how a shell quotes), and they were being proven on Linux
      # only while shipping to macOS and Windows users.
      # This job's contract is the DEGRADED core: no ctags, no enry, no jscpd, no jj. So it runs
      # the suites that are meaningful without them. Running everything here was tried and is
      # wrong — the language suite asserts `ctags is available` rather than skipping, by design,
      # because a language claim that silently degrades is the failure it exists to catch.
      #
      # Full cross-platform coverage of the REST of the suite is the `full suite on <os>` job
      # below, which installs the backends on all three operating systems.
      #
      # THE LIST IS NOW DATA, IN .github/guard-corpus.txt, AND IT IS LONGER.
      #
      # It used to be typed here, and test/e2e/adversarial.test.mjs was not on it — nor were
      # break-it, strict-read-only, unprotect-force, stash-evidence or verify. Those six reached
      # Windows and macOS only by being swept up in `npm test`'s `test/**/*.test.mjs` glob in the
      # `full suite on <os>` job. That is coverage by accident, and its failure mode is silent:
      #
      #     $ node --test "test/nonexistent/**/*.test.mjs" ; echo $?
      #     ℹ pass 0
      #     0
      #
      # A glob that matches nothing exits 0, so a green `npm test` is not evidence that any named
      # file ran. The adversarial corpus is the suite most likely to expose the FIFTH Windows path
      # bug in a project that has already found four, and it was the one nothing named here.
      #
      # scripts/run-guard-corpus.mjs names every file and refuses to start if one is missing or
      # empty. Each entry is proven to pass with no optional backends installed, which is this
      # job's contract. scripts/check-ci-hardening.mjs fails the build if this step ever stops
      # running on ubuntu-latest, macos-latest AND windows-latest.
      #
      # supply-chain.test.mjs is in the CROSS-PLATFORM list, not the Linux-only one, because the
      # audit enumerates and hashes the shipped file set — the single most path-separator-
      # sensitive thing in the package. A manifest keyed by "src\git.mjs" on Windows and
      # "src/git.mjs" everywhere else would report every file as missing on one OS, and a
      # customer's first experience of our security evidence would be it failing on their laptop.
      - name: the guard corpus, named explicitly, on this OS
        run: node scripts/run-guard-corpus.mjs
      - run: node bin/holt.mjs doctor --json
      - name: the supply-chain audit must pass on this OS
        run: node bin/holt.mjs audit
      - name: the tool must run against its own repository on this OS
        run: node bin/holt.mjs status --json

      # THE FIRST THING A USER DOES, PROVEN ON THEIR OS. The published install is a global install
      # of the release tarball; it was verified in a Linux container and nowhere else, so the
      # single most common failure mode for a Node CLI on Windows — a bin shim that does not
      # resolve, or a path assumption that only holds under POSIX — could not have been caught.
      - name: install the packed tarball globally and run it, as a user would
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" >/dev/null
          TARBALL="$(ls "$RUNNER_TEMP"/holt-*.tgz | head -1)"
          npm install -g "$TARBALL"
          holt --version
          # A directory that is NOT the holt checkout, so any reliance on the repo being present
          # (relative optlib paths, fixtures, node_modules) fails here rather than at a user.
          mkdir -p "$RUNNER_TEMP/victim" && cd "$RUNNER_TEMP/victim"
          git init -q -b main .
          git config user.email ci@holt.test && git config user.name CI
          echo base > a.txt && git add -A && git commit -qm base
          git worktree add -q --detach wt1
          echo 'export function ONLY_COPY() {}' > wt1/only.js
          holt status
          holt risk --json > risk.json
          node -e "const r=require('./risk.json');const u=(r.unique||r.workstreams||[]);if(!JSON.stringify(r).includes('wt1'))throw new Error('installed holt did not see the worktree: '+JSON.stringify(r).slice(0,300));console.log('  installed binary correctly analysed a fresh repo')"

  bare:
    name: no optional deep/external analyzers
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', package-manager-cache: false }
      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks
      - name: assert the optional tools really are absent
        run: |
          ! command -v ctags || (echo "ctags present; this job must test the degraded path" && exit 1)
          ! command -v enry  || (echo "enry present; this job must test the degraded path" && exit 1)
      - run: npm ci --omit=optional
      - run: node bin/holt.mjs doctor --json
      - name: unit + safety must pass with no backends at all
        run: node --test "test/unit/safety.test.mjs"
      - name: holt must still answer, degraded and labelled
        run: |
          node bin/holt.mjs status --json > /tmp/out.json
          node -e "
            const r = require('/tmp/out.json');
            if (!r.backend.degraded) { console.error('expected degraded backend'); process.exit(1); }
            console.log('degraded as expected:', r.backend.label);
          "

  full:
    name: all backends
    # Hosted run 31477499554 measured 5m06s of setup plus a 53m59s complete proof; mutation was
    # 47m22s of that proof. The former 60-minute cap left under one minute for artifact retention
    # and final gates. Seventy-five minutes is the measured path plus 25% runner-variance headroom,
    # and the CI hardening gate below rejects duplicate corpus/mutation work that could consume it.
    timeout-minutes: 75
    runs-on: ubuntu-latest
    env:
      HOLT_REAL_REPOS: ${{ github.workspace }}/.holt-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', package-manager-cache: false }
      - name: isolate fixture Git configuration
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/holt-empty-home" "$RUNNER_TEMP/holt-empty-xdg"
          : > "$RUNNER_TEMP/holt-empty-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/holt-empty-gitconfig" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_SYSTEM=$RUNNER_TEMP/holt-empty-gitconfig" >> "$GITHUB_ENV"
          echo "HOME=$RUNNER_TEMP/holt-empty-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/holt-empty-xdg" >> "$GITHUB_ENV"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.5' }

      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks

      - name: install universal-ctags
        # apt, deliberately, even though it ships an older parser set (5.9.0 on Ubuntu 24.04, no
        # Terraform/Elm). The snap build is newer but CONFINED: it cannot read files outside the
        # user's home, so every test that tags a fixture in a temp directory fails with an empty
        # result — a sandbox artefact masquerading as a parser regression. holt's language suite
        # is capability-aware (it asks `ctags --list-languages` and reports what this build cannot
        # parse), so the older apt package produces an honest, passing run rather than a false one.
        run: |
          sudo apt-get update && sudo apt-get install -y universal-ctags bubblewrap
          ctags --version | head -1

      - name: install enry (content-based language detection)
        run: |
          go install github.com/go-enry/go-enry/v2/cmd/enry@v2.9.6
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: install jj (Jujutsu backend)
        run: |
          # The hosted image includes rustup but deliberately has no default toolchain. A
          # feature-proof run that silently omits jj is not a complete backend run, so install
          # the small stable toolchain explicitly and fail rather than publishing a green
          # denominator with the Jujutsu surface absent.
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo install --locked jj-cli --version 0.43.0 --root "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: install opencode (one of the 30 integration targets holt wires)
        # THE PUBLISHED TEST COUNT MUST NOT DEPEND ON WHAT THE GRADER HAPPENS TO HAVE INSTALLED.
        # test/e2e/opencode-plugin.test.mjs ends in `t.skip('opencode not installed')` when the
        # binary is absent, so this job measured 697 passing while README claimed 698 and
        # BENCHMARKS explained a 698/699 split — three numbers for one suite, and the
        # published-numbers gate failed the build over the difference rather than the difference
        # being fixed.
        #
        # The deeper reason to install it: opencode is a SHIPPED integration target, and the only
        # test that drives the real binary has therefore never run in CI once. An adapter proven
        # solely on the maintainer's machine is exactly the class this workflow's other jobs exist
        # to close.
        run: |
          test "$(npm view opencode-ai@1.18.13 dist.integrity)" = "sha512-HYmBizm5vyAqqYuKzhpleRdEKwh7TeFSeA4f/Edl0F8OSPnbLi3DaXNMtmtsL13e2/994M9JoIz11yrVNdoAfA=="
          npm install -g opencode-ai@1.18.13
          opencode --version

      - run: npm ci
      - name: install browser proof dependency (no browser download)
        run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.62.1

      - name: doctor
        run: node bin/holt.mjs doctor

      - name: clone real repositories for the end-to-end suite
        # Cloned to the SAME path every later step reads (see the job-level env below). When these
        # disagreed, the four real-repo tests — the ones with the most external validity — skipped
        # in the suite step and had never once run in CI.
        run: bash scripts/clone-fixtures.sh "$HOLT_REAL_REPOS"

      - name: bounded feature proof with complete denominators
        # This is intentionally stricter than the ordinary suite: every test file is named, every
        # optional backend is required, every skip/todo/cancellation invalidates the result, and
        # mutation/CI/release/host/path gates are retained in one source-bound artifact.
        run: node scripts/run-feature-proof.mjs --out "$RUNNER_TEMP/feature-proof.json"

      - name: retain the feature-proof artifact, including an invalid completed run
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feature-proof-linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/feature-proof.json
            ${{ runner.temp }}/feature-proof.json.sha256

      - name: public claims match the retained proof denominators
        # The feature proof already ran every test file and the full mutation fingerprint. Verify
        # its SHA-256 sidecar and reuse those exact denominators; independently rerunning both here
        # made a successful job structurally unable to finish inside its own timeout.
        run: node scripts/run-feature-proof.mjs --verify-publication "$RUNNER_TEMP/feature-proof.json"

      - name: the tool must be able to inspect its own repository
        run: node bin/holt.mjs status

  crossplat:
    name: portable suite on ${{ matrix.os }} / Node ${{ matrix.node }}
    timeout-minutes: 60
    # 24 OF 39 TEST FILES RAN ON LINUX ONLY — the MCP protocol, the TUI, the graph export, the
    # journal, the team layer, the monster round, the host manifest, the packaging guard. A tool
    # that manipulates paths for a living was proving its most platform-sensitive half on the one
    # platform where paths are simplest. Three defects in a single session were invisible on Linux
    # and live on macOS and Windows, each found by CI rather than by the suite.
    #
    # So the whole suite runs on all three, with the backends installed. The degraded-core matrix
    # above keeps its narrow list because its contract is the opposite one.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: '22.23.2' }
          - { os: ubuntu-latest, node: '24.19.0' }
          - { os: ubuntu-latest, node: '26.6.0' }
          - { os: macos-latest, node: '24.19.0' }
          - { os: windows-latest, node: '24.19.0' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: isolate fixture Git configuration (no runner-global filters)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/holt-empty-home" "$RUNNER_TEMP/holt-empty-xdg"
          : > "$RUNNER_TEMP/holt-empty-gitconfig"
          {
            echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/holt-empty-gitconfig"
            echo "GIT_CONFIG_SYSTEM=$RUNNER_TEMP/holt-empty-gitconfig"
            echo "HOME=$RUNNER_TEMP/holt-empty-home"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/holt-empty-xdg"
          } >> "$GITHUB_ENV"
      - name: isolate fixture Git configuration (no runner-global filters)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'holt-empty-gitconfig'
          $holtHome = Join-Path $env:RUNNER_TEMP 'holt-empty-home'
          $holtXdg = Join-Path $env:RUNNER_TEMP 'holt-empty-xdg'
          New-Item -ItemType Directory -Force -Path $holtHome, $holtXdg | Out-Null
          New-Item -ItemType File -Force -Path $config | Out-Null
          "GIT_CONFIG_GLOBAL=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "GIT_CONFIG_SYSTEM=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HOME=$holtHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "XDG_CONFIG_HOME=$holtXdg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks

      - name: install universal-ctags and Linux proof utilities (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y universal-ctags bubblewrap inotify-tools
      - name: install universal-ctags (macos)
        if: runner.os == 'macOS'
        run: brew install universal-ctags
      - name: install universal-ctags (windows)
        if: runner.os == 'Windows'
        run: choco install universal-ctags -y --no-progress

      # enry is not a nicety here. `.fs` is F# OR Forth, `.m` is Objective-C OR MATLAB, `.h` is C
      # OR C++ OR Objective-C — extension mapping cannot decide, and ctags picks one. Without enry
      # the F# corpus case resolved as Forth and yielded nothing, which is what this job caught on
      # macOS and Windows the first time it ran. Content-based detection is what makes the
      # language claim true, so the platforms that assert it must have it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: '1.26.5' }
      - name: install enry (content-based language detection)
        shell: bash
        run: |
          go install github.com/go-enry/go-enry/v2/cmd/enry@v2.9.6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: npm ci
      - name: install browser proof dependency (no browser download)
        shell: bash
        run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.62.1
      - name: what this platform actually has
        run: node bin/holt.mjs doctor
      - name: every portable test file (the pinned real-repo corpus has one required 4/4 owner)
        # The `full` Linux job above clones all four immutable fixture commits and runs npm test,
        # so real-repos.test.mjs is hard-failing 4/4 evidence there. This matrix enumerates every
        # other test file and refuses if the exclusion count drifts from exactly one. That keeps
        # Windows/macOS network variance from turning a portable regression job into a fixture
        # availability job without shrinking the real-corpus denominator.
        run: node scripts/run-crossplat-suite.mjs

  static:
    name: static analysis (ratchet)
    timeout-minutes: 20
    # 20,749 lines of JavaScript shipped with no linter, no type checker and no gate of any kind.
    # For a tool whose failure mode is permanent, unrecoverable data loss that is below standard.
    #
    # The gate RATCHETS: the diagnostic count may go down and may never go up. A gate that fails
    # from the day it is added gets deleted within a week; this one is green today, blocks the
    # next regression, and lowers its own ceiling whenever debt is paid down.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', package-manager-cache: false }
      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks
      - run: npm ci
      - run: npm run typecheck
      - name: native paths must never be compared as display strings
        # This is a portability gate, not release-day hygiene. It catches the raw path comparison
        # class behind /var vs /private/var and Windows case/8.3/slash failures in the PR that
        # introduces it, while the platform matrix supplies the independent runtime oracle.
        run: npm run lint:paths
      - name: HOSTS.md must match the manifest it is generated from
        # HOSTS.md drifted from src/integrate/hosts.mjs by hand at least twice (Cursor's block-hook
        # promotion, the Roo/Kilo split) before this existed. Same ratchet shape as typecheck above:
        # the checked-in file and what the generator produces from HOSTS/strengthLabel() must be
        # byte-identical, or the build fails with the regenerate command to run.
        run: npm run hosts:check
      - name: the workflows themselves must stay hardened
        # Three defects, each a SHAPE rather than an instance, and each one that comes back the
        # next time somebody adds a job:
        #   - a workflow with no `permissions:` block, inheriting a token broader than it needs;
        #   - an action pinned to a tag its owner can repoint under us (GitHub Docs: a full-length
        #     commit SHA "is currently the only way to use an action as an immutable release");
        #   - the guard corpus running on fewer than all three operating systems, or a test file
        #     named so that `test/**/*.test.mjs` can never see it.
        # `--self-test` plants one violation of each rule in a scratch copy first and requires the
        # checker to go RED on every one, so a gate that has quietly stopped checking fails the
        # build instead of passing it. It also asserts GREEN on the unmodified tree, because a
        # gate that fails a legitimate change gets deleted.
        run: node scripts/check-ci-hardening.mjs --self-test

  package:
    timeout-minutes: 20
    name: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', package-manager-cache: false }
      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks
      - run: npm ci
      - name: every checked-in release body must carry an install command
        # The gate lives here as well as on the release event so a body is caught in the PR that
        # writes it, not at publish time when someone is already watching the Releases tab.
        run: node scripts/check-release-body.mjs --all
      - name: pack and install globally from the tarball
        run: |
          npm pack
          npm install -g ./holt-*.tgz
      - name: the installed binary must run from a clean directory
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean
          # A bare CI runner has no git identity, and `git commit` exits 128 without one.
          # Set it locally for this throwaway repo rather than globally.
          git init -q
          git config user.email ci@holt.invalid
          git config user.name 'holt ci'
          git commit -q --allow-empty -m base
          holt doctor
          holt status
      - name: the INSTALLED artifact must answer correctly, not merely start
        # `holt doctor` and `holt status` above prove the binary runs. They do not prove it WORKS —
        # a build missing src/paths.mjs exits 1 for an uncaught exception, which an exit-code check
        # reads as a clean refusal. This drives the installed binary against a real repository with
        # planted at-risk work and checks the ANSWERS: that risk finds the planted work, that it
        # does not invent work in an empty worktree, and that gate's exit code AND its stated
        # verdict agree.
        #
        # It ran only in release-artifact.yml, on tag push — so a commit that broke the shipped
        # artifact stayed invisible until release day. That is exactly how the published v0.2.0
        # came to be missing four runtime modules and 12 of 14 language packs.
        run: node scripts/smoke-installed.mjs --bin holt
      - name: an install without optional dependencies must still work
        # A corporate mirror or `npm i --omit=optional` can remove the deep-clone backend. A global
        # npm 10 install has been observed to retain optional packages despite the flag, so this
        # proof uses a fresh non-global prefix outside the checkout, proves every declared optional
        # root physically absent and unresolvable, and only then runs the planted-work product
        # smoke against that exact installed binary. Required MCP/JSONC/TUF surfaces remain.
        env:
          OPTIONAL_PREFIX: ${{ runner.temp }}/holt-no-optional
        run: |
          set -euo pipefail
          set -- "$PWD"/holt-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one packed Holt tarball, found $#"
            exit 1
          fi
          npm install --ignore-scripts --omit=optional --prefix "$OPTIONAL_PREFIX" "$1"
          NODE_PATH= node scripts/check-omit-optional-install.mjs --prefix "$OPTIONAL_PREFIX"
          HOLT_BIN="$OPTIONAL_PREFIX/node_modules/holt/bin/holt.mjs"
          NODE_PATH= node "$HOLT_BIN" audit
          NODE_PATH= node scripts/smoke-installed.mjs --bin "$HOLT_BIN"
      - name: the published tarball must not ship anything operator-only
        run: |
          tar -tzf holt-*.tgz | tee /tmp/files.txt
          # Tests, fixtures, the license SERVER, operator scripts, legal docs, the site, and
          # above all anything key-shaped must never reach a public install. Each of these is a
          # real leak class: server/ holds the mint logic, and a signing key must never ship.
          for bad in 'package/test/' 'package/eval/' 'package/server/' 'package/legal/' 'package/site/' 'package/scripts/' '.key' 'signing' '.env'; do
            if grep -qi "$bad" /tmp/files.txt; then echo "FORBIDDEN in tarball: $bad"; exit 1; fi
          done
          echo "tarball is clean: bin/ src/ README LICENSE only"

  supply-chain:
    timeout-minutes: 30
    name: supply-chain evidence
    runs-on: ubuntu-latest
    # Everything here works with NO credentials. The two credentialed halves — npm provenance and
    # the detached manifest signature — live in release-artifact.yml and are guarded there, so this job
    # can prove the evidence is TRUE on every commit rather than only at release time. An SBOM
    # and an integrity manifest first generated on release day are two artefacts nobody has ever
    # seen fail.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '24.19.0', package-manager-cache: false }
      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks
      - run: npm ci

      - name: the integrity manifest must match the shipped files
        # Without this the manifest becomes a file somebody remembers to regenerate, and a
        # one-commit-stale manifest reports every honest change as tampering — the fastest way
        # to teach a customer to ignore the integrity check entirely.
        run: node scripts/gen-manifest.mjs --check

      - name: holt must pass its own supply-chain audit
        run: node bin/holt.mjs audit

      - name: the audit must be able to FAIL — a check nobody has seen go red is decoration
        # Law: prove the instrument can detect presence before trusting its silence. A planted
        # fetch() in a file that declares no network must turn the audit red and exit non-zero.
        # This runs against a disposable COPY; the checkout is never mutated.
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -r bin src package.json README.md LICENSE.md MANIFEST.sha256 SUPPLY-CHAIN.md "$WORK/"
          printf '\nexport const leak = (u) => fetch(u);\n' >> "$WORK/src/analyze.mjs"
          node "$WORK/bin/holt.mjs" audit --json > "$WORK/out.json" && rc=0 || rc=$?
          if [ "$rc" = 0 ]; then echo "::error::the audit passed a planted fetch() — it proves nothing"; exit 1; fi
          node -e "
            const r = require('$WORK/out.json');
            const c = r.checks.find(x => x.id === 'network');
            if (r.ok || c.ok) { console.error('the network check stayed green'); process.exit(1); }
            console.log('audit correctly failed:', c.summary);
          "
          rm -rf "$WORK"

      - name: SBOM — CycloneDX and SPDX, describing the SHIPPED tree not the dev tree
        run: node scripts/gen-sbom.mjs --out "$RUNNER_TEMP"

      - name: the SBOM must not describe software we do not ship
        run: |
          set -euo pipefail
          node -e "
            const b = require('$RUNNER_TEMP/holt.cdx.json');
            const pkg = require('./package.json');
            if (b.metadata.component.version !== pkg.version) throw new Error('SBOM version drift');
            const dev = (b.components||[]).filter(c => /stryker|babel|@types/i.test(c.name));
            if (dev.length) throw new Error('dev-only packages in the SBOM: ' + dev.map(c=>c.name).join(', '));
            const required = (b.components||[]).filter(c => c.scope !== 'optional');
            console.log('CycloneDX ' + b.specVersion + ': ' + required.length + ' required, ' + ((b.components||[]).length - required.length) + ' optional');
          "

      - name: the supply-chain suite
        run: node --test test/unit/supply-chain.test.mjs

  business:
    timeout-minutes: 30
    name: commerce and entitlement
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '22.23.2', package-manager-cache: false }
      - name: assert the required Git runtime and inert hooks boundary
        run: node scripts/check-git-runtime.mjs --verify-inert-hooks
      - run: npm ci
      # The paid path is money and reputation, so it is tested on every OS the buyer might run
      # CI on: offline license crypto (forgery, rotation, expiry, the free-tool-never-breaks
      # invariant), the policy engine's refuse-don't-silently-pass behaviour, and the full
      # Stripe purchase path over a real socket.
      - run: node --test test/unit/license.test.mjs test/unit/policy.test.mjs test/unit/server.test.mjs test/unit/milestone.test.mjs test/e2e/purchase-path.test.mjs test/e2e/branches.test.mjs test/e2e/autoprotect.test.mjs test/unit/attest.test.mjs test/unit/actor.test.mjs test/unit/siem.test.mjs test/e2e/audit-chain.test.mjs
      # MEASURED 2026-08-01: this gate was ALREADY RED on main and nobody had seen it, because it
      # only runs on push to the paid-path job and its two hits are in a file everybody trusts.
      # `src/license.mjs` puts the pricing URL in the customer-facing `fix:` string, which the
      # allowlist did not cover (it exempts `holt.dev/pricing` and `github.com`; the live URL is
      # `raed2180416.github.io`). So the exemptions below are not new leniency — they restore a
      # gate that was failing on strings that are IDENTIFIERS and HELP TEXT, never endpoints.
      #
      # The URL grep stays because a URL literal in src/ is a real smell. What it CANNOT do is
      # tell a schema identifier from an endpoint, so the actual property — "no src/ file can
      # reach the network at all" — is asserted structurally in test/unit/offline.test.mjs, which
      # runs on every platform and every job. Both gates, not one instead of the other.
      #
      # NOTE: this grep covers src/ ONLY, and the shipped package is bin/ + src/. The one file in
      # the project that really does open a socket (bin/install-ctags.mjs) was therefore in the
      # half this gate never looked at — the promise was true, but this instrument could not have
      # detected it being false. The complete check is `holt audit` in the supply-chain job, which
      # covers every shipped file and which a CUSTOMER can run. This stays as a fast, independent
      # second opinion.
      - name: no src/ file may make a network call (the no-telemetry promise)
        # The property is asserted by test/unit/no-network.test.mjs, which checks CAPABILITY —
        # src/ imports no network-capable module and contains no call site — instead of grepping
        # for URLs against a domain allowlist. The old grep failed the build the moment the
        # product's own pricing URL moved to a domain the allowlist did not name, because a URL in
        # help text is not a network call; and an allowlist is the wrong guarantee anyway, since it
        # says "we only talk to approved hosts" when the promise is "we do not talk".
        # The test also PROVES it fires, against seven planted exfiltration shapes.
        run: node --test test/unit/no-network.test.mjs

  required:
    timeout-minutes: 10
    name: required CI aggregate
    # A matrix job can contain a cancelled or skipped cell while the workflow's other jobs are
    # green. GitHub branch protection needs one stable check that observes every required job and
    # fails closed on failure, cancellation, or skip. This is intentionally last and always runs.
    if: ${{ always() }}
    needs: [matrix, bare, full, crossplat, static, package, supply-chain, business]
    runs-on: ubuntu-latest
    steps:
      - name: every required job must complete successfully
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const bad = Object.entries(needs).filter(([, value]) => value?.result !== 'success');
          if (bad.length) {
            for (const [name, value] of bad) console.error(`${name}: ${value?.result ?? 'missing'}`);
            process.exit(1);
          }
          console.log(`all ${Object.keys(needs).length} required CI jobs passed`);
          NODE
